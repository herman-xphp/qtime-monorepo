name: Q-Time CI/CD pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # 🏗️ Build Job: Ensures Dockerfiles are valid
  build-containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build All Services
        run: docker compose build

  # 🧪 Test Job: Runs Unit Tests & Linters
  unit-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Setup Go
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      
      # Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

       # Run Tests via Makefile
      - name: Test Notification Worker (Node)
        run: |
          cd services/notification-worker
          npm install
          npm run lint
          # npm test # Uncomment when tests are added

      - name: Test Queue Engine (Go)
        run: |
          cd services/queue-engine
          # go test ./... # Uncomment when tests are fixed

